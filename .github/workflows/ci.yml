name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ---------- 后端：代码规范 + 测试 ----------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt
      - name: ruff 代码规范检查
        run: ruff check backend
      - name: pytest 测试
        run: pytest backend/tests -v

  # ---------- 前端：类型检查 + lint + 构建 ----------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: frontend
      - name: ESLint 检查
        run: npm run lint
        working-directory: frontend
      - name: 单元测试
        run: npm run test
        working-directory: frontend
      - name: 构建（含 vue-tsc 类型检查）
        run: npm run build
        working-directory: frontend

  # ---------- Docker：验证多阶段镜像可构建 ----------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker 镜像（多阶段：前端产物 + 后端 gunicorn）
        run: docker build -t flask-vue3-template:ci .