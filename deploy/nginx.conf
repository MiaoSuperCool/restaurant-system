# 「餐饮多门店系统」的 nginx 站点配置
#
# 服务器上的用法：
#   1. 把下面那个 server_name 改成你自己的域名
#   2. cp deploy/nginx.conf /etc/nginx/sites-available/restaurant
#   3. ln -sf /etc/nginx/sites-available/restaurant /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 为什么要有这一层：容器里的 gunicorn 只监听 127.0.0.1:18080（.env 里的 APP_PORT），
# 本机以外连不上。nginx 占着 80/443 对外，转发过去——顺便给后面的 HTTPS 留了位置。

server {
    listen 80;

    # ↓↓↓ 改成你自己的域名（改完记得 nginx -t 检查一下）
    server_name 你的域名;

    # 三个前端（/ 、/customer/ 、/staff/）和 /api 全在同一个 Flask 进程里，
    # 路径一个字都不用改写，整套原样转给容器
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto 现在其实用不上（这个项目不生成外部链接），
        # 但代理层是最容易漏配的地方，等要用再回来补，往往已经排查半天了
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx 默认只让传 1m，业务上没有上传需求，先留个够用的口子
    client_max_body_size 10m;
}

# 上了 HTTPS 之后不用手写 443 那段：
#   certbot --nginx -d 你的域名
# 它会自动往这个文件里补。
#
# 补完记得在仓库根的 .env 里加一行 SESSION_COOKIE_SECURE=true 再
# docker compose up -d —— 容器和 nginx 之间是 http，它自己看不出外面已经是 https 了。
